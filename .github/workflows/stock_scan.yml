name: Swing Trade Agent

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 美東 6:30am
    - cron: '30 20 * * 1-5'   # 美東 4:30pm
  workflow_dispatch:
    inputs:
      scan_ticker:
        description: '單股分析（留空為全量掃描）'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay（全量掃描才需要）
        if: ${{ github.event.inputs.scan_ticker == '' }}
        run: sleep $((RANDOM % 120))

      - name: Run agent
        run: python main.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          SCAN_TICKER:        ${{ github.event.inputs.scan_ticker }}
